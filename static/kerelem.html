<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kérelem Generátor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4; /* DEFAULT: #f4f4f4 | DECEMBER: #2d5016 */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .container {
            width: 80vw;
            max-width: 900px;
            margin: 2rem auto;
            background: #fff; /* DEFAULT: #fff | DECEMBER: #c41e3a */
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
            color: #000; /* DEFAULT: #000 | DECEMBER: #fff */
        }

        h1 {
            text-align: center;
        }

        /* ==================== DECEMBER EASTER EGGS - START ==================== */
        
        .santa-hat {
            display: none;
            font-size: 0.6em;
            margin-left: 0.3em;
            vertical-align: middle;
        }

        .snowflake {
            position: fixed;
            top: -10px;
            z-index: 9999;
            user-select: none;
            cursor: default;
            animation-name: snowfall;
            animation-duration: 10s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            opacity: 0.7;
            color: #a8d8ff;
            font-size: 1em;
            pointer-events: none;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
        }

        @keyframes snowfall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0.6;
            }
        }

        .snowflake:nth-of-type(2n) {
            animation-duration: 12s;
        }

        .snowflake:nth-of-type(3n) {
            animation-duration: 8s;
        }

        .snowflake:nth-of-type(4n) {
            font-size: 1.2em;
        }

        .snowflake:nth-of-type(5n) {
            font-size: 0.8em;
        }

        /* ==================== DECEMBER EASTER EGGS - END ==================== */

        label,
        .form-section-label {
            display: block;
            margin-top: 1rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.3rem;
            box-sizing: border-box;
        }

        canvas {
            border: 1px solid #333;
            display: block;
            margin: 1rem 0;
            touch-action: none;
        }

        .actions {
            text-align: center;
            margin-top: 2rem;
        }

        button {
            padding: 0.7rem 2rem;
            margin: 0 0.5rem;
        }

        .calendar-popup {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            width: 280px;
            margin-top: 0.5rem;
            color: #000;
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .calendar-nav button {
            background: none;
            border: none;
            font-size: 1.2rem;
            line-height: 1;
            cursor: pointer;
            padding: 0.3rem 0.7rem;
            border-radius: 50%;
        }

        .calendar-nav button:hover {
            background: #f0f0f0;
        }

        .calendar-month-label {
            font-weight: 600;
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 0.3rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .calendar-day {
            text-align: center;
            padding: 0.45rem 0;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 50%;
        }

        .calendar-day:hover {
            background: #f0f0f0;
        }

        .calendar-day-empty {
            cursor: default;
        }

        .calendar-day.calendar-today {
            font-weight: 700;
            text-decoration: underline;
        }

        /* Continuous highlighted band between the selected start and end day */
        .calendar-day.range-mid {
            background: #ffe1e8;
            border-radius: 0;
        }

        .calendar-day.range-start {
            background: #e00b41;
            color: #fff;
            border-radius: 15% 0 0 15%;
        }

        .calendar-day.range-end {
            background: #e00b41;
            color: #fff;
            border-radius: 0 15% 15% 0;
        }

        /* Single selected day (no range yet) stays a full circle */
        .calendar-day.range-single {
            background: #e00b41;
            color: #fff;
            border-radius: 15%;
        }

        .calendar-day.range-start.range-end {
            border-radius: 15%;
        }

        @media (max-width: 600px) {
            .container {
                max-width: 90vw;
                padding: 0.5rem;
                border-radius: 0;
                box-shadow: none;
            }

            h1 {
                font-size: 1.3rem;
            }

            label {
                font-size: 1rem;
                margin-top: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kérelem Generátor<span class="santa-hat">🎅</span></h1>
        <form id="requestForm">
            <label>Szülő neve <input name="parentName" required></label>
            <label>Óvoda
                <select name="preschool" required>
                    <option value="Nagybácsai Óvoda Kisbácsai Tagóvodájában">Nagybácsai Óvoda Kisbácsai Tagóvodája</option>
                    <option value="Nagybácsia Óvoda Bóbita Tagóvodájában">Nagybácsia Óvoda Bóbita Tagóvodája</option>
                </select>
            </label>
            <label>Csoport <input name="group" required></label>
            <label>Gyermek neve <input name="childName" required></label>
            <label>Indok <input name="reason" required></label>
            <small id="reasonPreview" style="display:block; color:#666; margin-top:0.2rem;"></small>
            <div class="form-section-label">Időszak</div>
            <div class="date-range-wrapper">
                <div class="calendar-popup" id="calendarPopup">
                    <div class="calendar-nav">
                        <button type="button" id="calPrevBtn" aria-label="Előző hónap">‹</button>
                        <div class="calendar-month-label" id="calMonthLabel"></div>
                        <button type="button" id="calNextBtn" aria-label="Következő hónap">›</button>
                    </div>
                    <div class="calendar-weekdays">
                        <span>H</span><span>K</span><span>Sz</span><span>Cs</span><span>P</span><span>Szo</span><span>V</span>
                    </div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
            </div>
            <small id="dateRangeSummary" style="display:block; color:#666; margin-top:0.4rem;"></small>
            <input type="hidden" name="fromDate">
            <input type="hidden" name="toDate">
            <label>Aláírás (rajzold le):</label>
            <canvas id="signature" width="280" height="150"></canvas>
            <button type="button" onclick="clearSignature()">Törlés</button>
            <label>Export formátum
                <select name="format">
                    <option value="pdf">PDF</option>
                    <option value="image">Kép (JPEG)</option>
                </select>
            </label>
            <div class="actions">
                <button type="submit">Generálás</button>
            </div>
        </form>
    <div id="validationMsg" style="color: red; margin-top: 1rem;"></div>
    <div id="result"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
    // ==================== DECEMBER EASTER EGGS - START ====================
    (function() {
        const currentMonth = new Date().getMonth();
        if (currentMonth === 11) { // December is month 11 (0-indexed)
            // Apply Christmas colors
            document.body.style.background = '#2d5016'; // Dark green
            const container = document.querySelector('.container');
            if (container) {
                container.style.background = '#c41e3a'; // Christmas red
                container.style.color = '#fff'; // White text
            }
            
            // Show Santa hat
            const santaHat = document.querySelector('.santa-hat');
            if (santaHat) santaHat.style.display = 'inline';
            
            // Create snowflakes
            const snowflakeCount = 30;
            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.innerHTML = '❄';
                snowflake.style.left = Math.random() * 100 + '%';
                snowflake.style.animationDelay = Math.random() * 10 + 's';
                snowflake.style.animationDuration = (Math.random() * 5 + 8) + 's';
                document.body.appendChild(snowflake);
            }
        }
    })();
    // ==================== DECEMBER EASTER EGGS - END ====================

    // Hungarian date formatting function
    function formatDateHungarian(date, removeTrailingDot = false) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}. ${month}. ${day}${removeTrailingDot ? '' : '.'}`;
    }
    
    // Signature canvas logic with caching and smoothing
    const canvas = document.getElementById('signature');
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#1a237e'; // ink-like color
    ctx.lineWidth = 2;
    let drawing = false;
    let points = [];
    // Load cached signature if exists
    const cachedSignature = localStorage.getItem('kerelem_signature');
    if (cachedSignature) {
        const img = new window.Image();
        img.onload = function() { ctx.drawImage(img, 0, 0); };
        img.src = cachedSignature;
    }
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches) {
            return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        } else {
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
    }
    function drawSmoothLine() {
        if (points.length < 3) {
            const p = points[0];
            ctx.beginPath();
            ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, 2 * Math.PI, true);
            ctx.fill();
            ctx.closePath();
            return;
        }
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 2; i++) {
            const c = (points[i].x + points[i + 1].x) / 2;
            const d = (points[i].y + points[i + 1].y) / 2;
            ctx.quadraticCurveTo(points[i].x, points[i].y, c, d);
        }
        ctx.quadraticCurveTo(
            points[points.length - 2].x,
            points[points.length - 2].y,
            points[points.length - 1].x,
            points[points.length - 1].y
        );
        ctx.stroke();
    }
    canvas.addEventListener('mousedown', e => {
        drawing = true;
        points = [getPos(e)];
    });
    canvas.addEventListener('touchstart', e => {
        e.preventDefault(); // Prevent scrolling and pull-to-refresh
        drawing = true;
        points = [getPos(e)];
    });
    canvas.addEventListener('mouseup', e => {
        drawing = false;
        localStorage.setItem('kerelem_signature', canvas.toDataURL('image/png'));
    });
    canvas.addEventListener('touchend', e => {
        e.preventDefault(); // Prevent default touch behavior
        drawing = false;
        localStorage.setItem('kerelem_signature', canvas.toDataURL('image/png'));
    });
    canvas.addEventListener('mousemove', e => {
        if (!drawing) return;
        points.push(getPos(e));
        drawSmoothLine();
    });
    canvas.addEventListener('touchmove', e => {
        e.preventDefault(); // Prevent scrolling while drawing
        if (!drawing) return;
        points.push(getPos(e));
        drawSmoothLine();
    });
    
    // Prevent context menu and other unwanted behaviors on canvas
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('selectstart', e => e.preventDefault());
    canvas.addEventListener('dragstart', e => e.preventDefault());
    
    // Additional touch event protection for mobile
    canvas.addEventListener('touchcancel', e => {
        e.preventDefault();
        drawing = false;
    });
    window.clearSignature = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        localStorage.removeItem('kerelem_signature');
    }

    // Cache form values on change (except dates)
    const form = document.getElementById('requestForm');
    ['parentName','preschool','group','childName','reason'].forEach(name => {
        const input = form[name];
        input.value = localStorage.getItem('kerelem_' + name) || '';
        input.addEventListener('input', () => {
            localStorage.setItem('kerelem_' + name, input.value);
        });
    });

    // Live preview of how the reason will appear in the document
    const reasonPreview = document.getElementById('reasonPreview');
    function updateReasonPreview() {
        const reason = form.reason.value.trim();
        reasonPreview.textContent = reason ? `Előnézet: „${reason} ok miatt”` : '';
    }
    form.reason.addEventListener('input', updateReasonPreview);
    updateReasonPreview();

    // ---- Airbnb-style date range picker ----
    const dateRangeSummary = document.getElementById('dateRangeSummary');
    const calendarPopup = document.getElementById('calendarPopup');
    const calendarGrid = document.getElementById('calendarGrid');
    const calMonthLabel = document.getElementById('calMonthLabel');
    const calPrevBtn = document.getElementById('calPrevBtn');
    const calNextBtn = document.getElementById('calNextBtn');
    const MONTH_NAMES = ['Január', 'Február', 'Március', 'Április', 'Május', 'Június', 'Július', 'Augusztus', 'Szeptember', 'Október', 'November', 'December'];

    let rangeStart = null;
    let rangeEnd = null;
    let viewDate = new Date();
    viewDate.setDate(1);

    function toISODate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }
    function sameDay(a, b) {
        return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function updateHiddenFieldsAndDisplay() {
        // A lone start day is a valid single-day request — mirror it into toDate too
        form.fromDate.value = rangeStart ? toISODate(rangeStart) : '';
        form.toDate.value = rangeEnd ? toISODate(rangeEnd) : (rangeStart ? toISODate(rangeStart) : '');
        if (rangeStart && rangeEnd) {
            dateRangeSummary.textContent = `Kiválasztva: ${formatDateHungarian(rangeStart, true)} - ${formatDateHungarian(rangeEnd, true)}`;
        } else if (rangeStart) {
            dateRangeSummary.textContent = `Kiválasztva: ${formatDateHungarian(rangeStart, true)} (1 nap)`;
        } else {
            dateRangeSummary.textContent = 'Válasszon kezdő dátumot';
        }
    }

    function renderCalendar() {
        calMonthLabel.textContent = `${viewDate.getFullYear()}. ${MONTH_NAMES[viewDate.getMonth()]}`;
        calendarGrid.innerHTML = '';
        const firstOfMonth = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
        const startOffset = (firstOfMonth.getDay() + 6) % 7; // Monday-based grid
        const daysInMonth = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 0).getDate();
        const today = new Date();

        for (let i = 0; i < startOffset; i++) {
            const empty = document.createElement('div');
            empty.className = 'calendar-day calendar-day-empty';
            calendarGrid.appendChild(empty);
        }
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(viewDate.getFullYear(), viewDate.getMonth(), day);
            const cell = document.createElement('div');
            cell.className = 'calendar-day';
            cell.textContent = day;
            if (sameDay(date, today)) cell.classList.add('calendar-today');
            if (rangeStart && rangeEnd && date > rangeStart && date < rangeEnd) cell.classList.add('range-mid');
            if (rangeStart && sameDay(date, rangeStart)) cell.classList.add(rangeEnd ? 'range-start' : 'range-single');
            if (rangeEnd && sameDay(date, rangeEnd)) cell.classList.add('range-end');
            cell.addEventListener('click', () => selectDate(date));
            calendarGrid.appendChild(cell);
        }
    }

    function selectDate(date) {
        if (!rangeStart || (rangeStart && rangeEnd)) {
            // Start a new range
            rangeStart = date;
            rangeEnd = null;
        } else if (date < rangeStart) {
            // Picked an earlier date second — becomes the new start
            rangeEnd = rangeStart;
            rangeStart = date;
        } else {
            rangeEnd = date;
        }
        updateHiddenFieldsAndDisplay();
        renderCalendar();
    }

    calPrevBtn.addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() - 1); renderCalendar(); });
    calNextBtn.addEventListener('click', () => { viewDate.setMonth(viewDate.getMonth() + 1); renderCalendar(); });

    updateHiddenFieldsAndDisplay();
    renderCalendar();

    // Cache preferred download type
    const formatSelect = form.format;
    formatSelect.value = localStorage.getItem('kerelem_format') || 'pdf';
    formatSelect.addEventListener('change', () => {
        localStorage.setItem('kerelem_format', formatSelect.value);
    });

    // Cache signature on change
    canvas.addEventListener('mouseup', () => {
        localStorage.setItem('kerelem_signature', canvas.toDataURL('image/png'));
    });
    canvas.addEventListener('touchend', () => {
        localStorage.setItem('kerelem_signature', canvas.toDataURL('image/png'));
    });

    form.onsubmit = async function(e) {
        e.preventDefault();
        // Validation
        const parentName = form.parentName.value.trim();
        const preschool = form.preschool.value;
        const group = form.group.value.trim();
        const childName = form.childName.value.trim();
        const reason = form.reason.value.trim();
        const fromDate = form.fromDate.value;
        const toDate = form.toDate.value;
        const format = form.format.value;
        let valid = true;
        let msg = '';
        if (!parentName || !preschool || !group || !childName || !reason || !fromDate || !toDate) {
            valid = false;
            msg = 'Minden mező kitöltése kötelező!';
        } else if (toDate < fromDate) {
            valid = false;
            msg = 'A vég dátum nem lehet korábbi, mint a kezdő dátum!';
        }
        if (!localStorage.getItem('kerelem_signature')) {
            valid = false;
            msg = 'Kérjük, rajzolja le az aláírást!';
        }
        document.getElementById('validationMsg').textContent = msg;
        if (!valid) return;
        // Calculate onDate (one day before fromDate)
        let onDate = '';
        if (fromDate) {
            const d = new Date(fromDate);
            d.setDate(d.getDate() - 1);
            onDate = formatDateHungarian(d);
        }
        
        // Format dates to Hungarian
        const fromDateHu = formatDateHungarian(new Date(fromDate), true);
        const toDateHu = formatDateHungarian(new Date(toDate), true);
        // Get signature image
        const signatureData = canvas.toDataURL('image/png'); // Keep PNG for signature transparency
        localStorage.setItem('kerelem_signature', signatureData);
        // Compose document HTML
        const docHtml = `
        <div id="exportDoc" style="font-family: 'Times New Roman', Times, serif; color: #222; width: 900px; padding: 45px 150px; background: #fff; box-sizing: border-box;">
            <h2 style="text-align:center;">Kérelem</h2>
            <p>Alulírott <b>${parentName}</b> szülő azzal a kéréssel fordulok a(z) <b>${group}</b> csoport óvodapedagógusához, hogy a <b>${preschool}</b> jogviszonnyal rendelkező <b>${childName}</b> nevű gyermekem távolmaradását az óvodából <b>${reason}</b> ok miatt, <b>${fromDateHu}</b>-tól <b>${toDateHu}</b>-ig engedélyezni szíveskedjen.</p>
            <br><br>
            <div style="display:flex; justify-content:space-between;">
                <div>Győr, <b>${onDate}</b></div>
                <div style="text-align:center;">
                    <img src="${signatureData}" style="height:50px; display:block; margin:auto;">
                    <div style="text-align:center; border-top:2px dotted #222; width:200px; padding-top:20px;">szülő aláírása</div>
                </div>
            </div>
        </div>`;
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = '';
        const temp = document.createElement('div');
        temp.style.position = 'fixed';
        temp.style.left = '-9999px';
        temp.innerHTML = docHtml;
        document.body.appendChild(temp);
        const exportDoc = temp.querySelector('#exportDoc');
        const rect = exportDoc.getBoundingClientRect();
        const exportWidth = Math.ceil(rect.width);
        const exportHeight = Math.ceil(rect.height);
        
        // Generate consistent filename base
        const fileNameBase = `kerelem_${fromDate}_${toDate}`;
        
        if (format === 'pdf') {
            const { jsPDF } = window.jspdf;
            // Page size follows content, so a shorter document yields a shorter page
            const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [exportWidth, exportHeight] });
            await html2canvas(exportDoc, { scale: 1.5, width: exportWidth, height: exportHeight }).then(canvas => {
                const imgData = canvas.toDataURL('image/jpeg', 0.85); // Use JPEG with 85% quality for smaller size
                pdf.addImage(imgData, 'JPEG', 0, 0, exportWidth, exportHeight);
                pdf.save(`${fileNameBase}.pdf`);
            });
        } else {
            await html2canvas(exportDoc, { scale: 1.5, width: exportWidth, height: exportHeight }).then(canvas => {
                const imgData = canvas.toDataURL('image/jpeg', 0.85); // JPEG with 85% quality
                const link = document.createElement('a');
                link.href = imgData;
                link.download = `${fileNameBase}.jpg`;
                link.click();
            });
        }
        document.body.removeChild(temp);
    }
    </script>
</body>
</html>
